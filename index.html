*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#000;color:#EDEDED;font-family:'Michroma',sans-serif;
  min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;position:relative;

}
#dustField{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
@keyframes tw{0%,100%{opacity:var(--o)}50%{opacity:calc(var(--o)*.22)}}
.tw{animation-name:tw;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;padding:24px}
.mark{width:clamp(218px,36vmin,330px);height:auto;display:block;animation:markIn 1.6s ease both}

#bandGroup{transform-box:fill-box;transform-origin:center}
a.wm{display:block;width:clamp(250px,32vw,440px);margin-top:clamp(20px,4.2vh,40px);line-height:0;
  opacity:0;animation:rise 1.1s cubic-bezier(.22,.8,.3,1) 2.35s both;transition:filter .5s ease}
a.wm:hover{filter:drop-shadow(0 0 14px rgba(234,165,78,.28))}
a.wm:focus-visible{outline:1px solid rgba(242,216,148,.6);outline-offset:8px}
.wm-svg{width:100%;height:auto;display:block}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.line{margin-top:clamp(24px,5vh,46px);font-size:clamp(12px,1.45vw,16px);letter-spacing:.24em;margin-right:-.84em;
  color:#E9E7E2;text-align:center;opacity:0;animation:rise 1.1s cubic-bezier(.22,.8,.3,1) 2.8s both}
.rule{margin-top:clamp(26px,5.2vh,48px);width:min(190px,42vw);height:1px;border:0;
  background:linear-gradient(90deg,rgba(242,216,148,0) 0%,rgba(242,216,148,0.27265524) 50%,rgba(166,43,26,0.27265524) 84.322078%,rgba(166,43,26,0) 100%);
  opacity:0;animation:rise 1.2s ease 3.25s both}
.receipts{margin-top:clamp(16px,3vh,26px);font-size:clamp(9px,1vw,11px);letter-spacing:.32em;margin-right:-.32em;
  color:rgba(216,213,206,.48);text-align:center;opacity:0;animation:rise 1.2s ease 3.5s both}
html.shot *,html.shot *::before,html.shot *::after{animation-duration:.001s !important;animation-delay:0s !important}
html.shot a.wm,html.shot .line,html.shot .rule,html.shot .receipts{opacity:1}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001s !important;animation-delay:0s !important}
  .tw{animation:none}
}

<script>
(function(){
  var shot = location.hash.indexOf('shot')>-1;
  var reduce = shot || window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* living dust: faint static field, a few specks breathing */
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  var rnd = mulberry32(210219), dust = document.getElementById('dust'), NS = 'http://www.w3.org/2000/svg';
  for (var i=0;i<130;i++){
    var c = document.createElementNS(NS,'circle');
    c.setAttribute('cx',(rnd()*1440).toFixed(0)); c.setAttribute('cy',(rnd()*900).toFixed(0));
    c.setAttribute('r',(0.7+rnd()*1.6).toFixed(1));
    c.setAttribute('fill', rnd()<0.12 ? '#F2D894' : '#E9EDF6');
    var o = 0.04+rnd()*0.18;
    c.setAttribute('opacity', o.toFixed(2));
    if (!reduce && i%11===0){
      c.setAttribute('class','tw');
      c.style.setProperty('--o', o.toFixed(2));
      c.style.animationDuration = (6+rnd()*7).toFixed(1)+'s';
      c.style.animationDelay = (-rnd()*9).toFixed(1)+'s';
    }
    dust.appendChild(c);
  }

  var PTS = [[200.0, 52.0, 3.6, 0.62], [243.6, 58.6, 4.4, 0.38], [283.4, 77.7, 5.2, 0.78], [315.7, 107.7, 4.0, 0.45], [337.8, 145.9, 5.6, 0.88], [347.6, 188.9, 5.0, 0.66], [344.3, 232.9, 3.8, 0.34], [328.2, 274.0, 3.4, 0.58], [300.7, 308.5, 4.6, 0.82], [264.2, 333.3, 3.9, 0.42], [222.1, 346.3, 5.8, 0.97], [177.9, 346.3, 4.8, 0.55], [135.8, 333.3, 5.4, 0.74], [99.3, 308.5, 4.1, 0.36], [71.8, 274.0, 3.5, 0.64], [55.7, 232.9, 4.3, 0.5], [52.4, 188.9, 5.1, 0.84], [62.2, 145.9, 5.7, 0.93], [84.3, 107.7, 4.2, 0.4], [116.6, 77.7, 4.9, 0.7], [156.4, 58.6, 3.7, 0.31]];
  var halos = document.querySelectorAll('#halos .halo');
  var cores = document.querySelectorAll('#cores .core');
  var band = document.getElementById('bandGroup');
  var glow = document.getElementById('bandGlow');

  if (reduce) return; /* static formed mark, exactly as authored */

  /* scatter start positions: the dust before it becomes the 0 */
  var srnd = mulberry32(9182), P = [];
  for (var j=0;j<PTS.length;j++){
    var ang = srnd()*Math.PI*2, rad = 120+srnd()*190;
    P.push({
      x: PTS[j][0], y: PTS[j][1],
      sx: 200+Math.cos(ang)*rad, sy: 200+Math.sin(ang)*rad*0.82,
      delay: srnd()*420, dur: 1450+srnd()*450,
      amp: 0.9+srnd()*1.5, per: 9000+srnd()*8000, ph: srnd()*Math.PI*2
    });
  }
  band.style.opacity = '0';
  function ease(t){return t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2}
  var T0 = null, FORM = 2650, IGNITE = 1750;
  function frame(ts){
    if (!T0) T0 = ts;
    var t = ts-T0, i, p, k;
    for (i=0;i<P.length;i++){
      p = P[i];
      k = (t-p.delay)/p.dur; k = k<0?0:(k>1?1:k);
      var e = ease(k), x, y;
      if (k>=1){
        x = p.x + Math.sin(t/p.per+p.ph)*p.amp;
        y = p.y + Math.cos(t/(p.per*1.17)+p.ph)*p.amp*0.8;
      } else {
        x = p.sx + (p.x-p.sx)*e;
        y = p.sy + (p.y-p.sy)*e;
      }
      halos[i].setAttribute('cx',x.toFixed(1)); halos[i].setAttribute('cy',y.toFixed(1));
      cores[i].setAttribute('cx',x.toFixed(1)); cores[i].setAttribute('cy',y.toFixed(1));
      var fade = 0.25+0.75*e;
      halos[i].setAttribute('opacity',(PTS[i][3]*0.30*fade).toFixed(2));
      cores[i].setAttribute('opacity',(PTS[i][3]*fade).toFixed(2));
    }
    if (t>IGNITE){
      var b = Math.min(1,(t-IGNITE)/750);
      band.style.opacity = ease(b).toFixed(3);
      band.style.transform = 'scale('+(0.94+0.06*ease(b)).toFixed(3)+')';
      glow.setAttribute('opacity',(0.5+0.10*Math.sin(t/1150)).toFixed(3)); /* the band breathes */
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
