<!doctype html>
<html lang="en" data-publication-ready="false">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>021 Labs</title>
  <meta name="description" content="we build what's next.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="masthead shell">
    <a class="maker" href="#hero" aria-label="021 Labs home">
      <img src="assets/mark-b-v4.svg" width="48" height="48" alt="">
      <span class="studio-wordmark">021 LABS</span>
    </a>
  </header>
  <main id="main">
    <section id="hero" class="hero" aria-labelledby="hero-title">
      <img id="hero-media" class="hero-image" src="assets/hero-emberline.png" width="1672" height="941" fetchpriority="high" alt="">
      <div class="hero-copy shell">
        <h1 id="hero-title">we build what’s next.</h1>
        <a class="scroll-cue" href="#zero" aria-label="Explore Zero"><span aria-hidden="true">↓</span></a>
      </div>
    </section>
    <section id="build" class="chapter shell" aria-labelledby="build-title" hidden>
      <h2 id="build-title">The build</h2>
      <!-- Reserved editorial media/copy. Populate only from cleared public artifact pins. -->
      <template id="build-content"></template>
    </section>
    <section id="zero" class="chapter shell zero" aria-labelledby="zero-title">
      <div class="zero-identity">
        <img src="assets/mark-c-v4.svg" width="96" height="96" alt="">
        <h2 id="zero-title" class="zero-wordmark">ZERO</h2>
      </div>
      <!-- Vocabulary specimen is inert, never an assertion about live actor/task state. -->
      <template id="zero-state-vocabulary">
        <ul class="state-vocabulary" aria-label="State vocabulary">
          <li>Verified</li><li>Pending</li><li>Veto</li><li>Running</li>
        </ul>
      </template>
    </section>
    <section id="proof" class="chapter shell" aria-labelledby="proof-title" hidden>
      <h2 id="proof-title">Proof</h2>
      <p>done is a verdict, not a claim.</p>
      <!-- No internal receipts or fabricated evidence. Public package required. -->
      <template id="proof-receipts"></template>
    </section>
    <section id="studio" class="chapter shell studio" aria-labelledby="studio-title">
      <h2 id="studio-title">Studio</h2>
      <p>021 Labs is my studio. We build websites, products, and brands. Zero is our flagship, the agent OS we're building in-house.</p>
    </section>
    <footer id="footer" class="footer shell">
      <img src="assets/mark-b-v4.svg" width="48" height="48" alt="021 Labs">
      <span>@021labsto</span>
    </footer>
  </main>
</body>
</html>
